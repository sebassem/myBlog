######################## default configuration ####################
baseURL = "https://www.seifbassem.com"
title = "Seif Bassem"
theme = "editor"
# post pagination
paginate = "12"
# post excerpt
summaryLength = "10"
# google analytics
googleAnalytics = "G-G81YKTRDZK" # example : UA-123-45
# disqus short name
#disqusShortname = "themefisher-template" # get your shortname form here : https://disqus.com
# disable language
disableLanguages = ["fr"] # desable language from here

############################# Outputs ##############################
[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
unsafe= true

############################# Plugins ##############################

# CSS Plugins
[[params.plugins.css]]
link = "plugins/bootstrap/bootstrap.min.css"
[[params.plugins.css]]
link = "plugins/slick/slick.css"

# JS Plugins
[[params.plugins.js]]
link = "plugins/jquery/jquery.min.js"
[[params.plugins.js]]
link = "plugins/bootstrap/bootstrap.min.js"
[[params.plugins.js]]
link = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/js/all.min.js"
attributes = "crossorigin='anonymous' defer='defer' data-search-pseudo-elements"
[[params.plugins.js]]
link = "plugins/slick/slick.min.js"
[[params.plugins.js]]
link = "plugins/search/fuse.min.js"
[[params.plugins.js]]
link = "plugins/search/mark.js"
[[params.plugins.js]]
link = "plugins/search/search.js"

#################### default parameters ################################
[params]
favicon = "images/favicon.ico"
logo_text = ""
logo = ""
logo_height = "26px"
logo_rotate = false
# Meta data
description = "This is a blog about the cloud , focusing on Microsoft Azure services and features"
author = "Seif Bassem"
# contact info
#address = "9567 Turner Trace Apt. BC C3G8A4"
#mobile = ""
#email = "seif.bassem@outlook.com"
# contact form action
contact_form_action = "#" # contact form works with https://formspree.io
# Search
search = true
# Main section
mainSections = ["blogs"]
# custom script on header
custom_script= ""

# site variables
[params.variables]
# color variables
primary_color = "#c98664"
secondary_color = "#c98665"
white = "#ffffff"
black = "#000000"
dark = "#2B2C2E"
gray = "#66676d"
light = "#a8aab2"

# font-size variables
h1 = "68px"
h1_lg = "52px"
h1_md = "40px"
h2 = "42px"
h2_md = "36px"
h3 = "32px"
h3_md = "28px"
h4 = "24px"
h5 = "18px"
h6 = "16px"

# font variable
# Give your font name from google font. add font weight using ":wght@" and separate by ";"
# example: "Work Sans:wght@400;600;700"
primary_font = "Lora:wght@500;600"
secondary_font = "Work Sans:wght@400;500;600"
icon_font = "Font Awesome 5 Free"

# Preloader
[params.preloader]
enable = false
preloader = "" # use jpg, png, svg or gif format.

# Subscription
[params.subscription]
enable = true
# mailchimp subsciption
mailchimp_form_action = "https://seifbassem.us6.list-manage.com/subscribe/post?u=257b2cad8c391bae63f348005&amp;id=ebd0aabf4e" # replace this url with yours
mailchimp_form_name = "b_257b2cad8c391bae63f348005_ebd0aabf4e" # replace this code with yours

# cookies
[params.cookies]
enable = false
expire_days = 2


######################## sidebar widgets #########################
[params.widgets]
sidebar = ["about-me", "recent-post", "categories", "tags"]
# available widget : search,about-me,authors,categories,tags,recent-post,social,promotion,subscription

############################# social site ########################
[[params.social]]
title = "Linkedin"
icon = "fab fa-linkedin" # Fhemify icon : https://themify.me/themify-icons
link = "https://www.linkedin.com/in/seif-bassem/"

[[params.social]]
title = "Twitter"
icon = "fab fa-twitter" # Fhemify icon : https://themify.me/themify-icons
link = "https://twitter.com/SeifBassem"

[[params.social]]
title = "Github"
icon = "fab fa-github" # Fontawesome icon pack : https://fontawesome.com/icons/
link = "https://github.com/sebassem"


